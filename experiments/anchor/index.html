<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anchor — WebXR Experiments</title>
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body>
    <main class="site">
      <p class="kicker"><a href="../../">Experiments</a> · 04</p>
      <h1>Anchor</h1>
      <p class="lede">
        Phone AR. After launch, start the AR session, aim at a floor or table, and tap
        to leave a peg. This browser needs immersive AR support.
      </p>
      <form data-launch action="play.html">
        <div class="option-list">
          <div class="option">
            <label class="option-copy" for="size">
              Peg size
              <small>Scale of each peg you place.</small>
            </label>
            <select id="size" name="size">
              <option value="0.7">Small</option>
              <option value="1" selected>Medium</option>
              <option value="1.6">Large</option>
            </select>
          </div>
          <div class="option">
            <label class="option-copy" for="limit">
              Peg limit
              <small>Stop placing after this many pegs.</small>
            </label>
            <select id="limit" name="limit">
              <option value="8">8</option>
              <option value="24" selected>24</option>
              <option value="40">40</option>
            </select>
          </div>
        </div>
        <button class="launch" type="submit">Launch</button>
      </form>
    </main>
    <script src="../../shared/launch.js"></script>
  </body>
</html>
