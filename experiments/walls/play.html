<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Walls — WebXR Experiments</title>
    <link rel="stylesheet" href="../../styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body class="stage">
    <header class="hud">
      <a class="back" href="./">Setup</a>
      <div>
        <h1>Walls</h1>
        <p id="preview">Checking this browser for immersive AR…</p>
      </div>
    </header>
    <button id="enter" class="launch enter" type="button" disabled>Enter AR</button>
    <div id="overlay">
      <p id="status">Looking for walls…</p>
      <button id="exit" class="launch enter" type="button">Exit</button>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
